<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contatos - Barbearia Space For Men</title>
   <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="contatos.css">
</head>
<body>
  <header>
        <div class="caixa">
            <h1><img src="./img/logo.png" alt=""></h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="produtos.html">Produtos</a></li>
                    <li><a href="contatos.html">Contatos</a></li>
                </ul>
            </nav>
        </div>
    </header>
    
   <main>

    <form action="">

        <label for="nome">Nome e Sobrenome</label>
        <input type="text"  placeholder="Nome e Sobrenome" id="nome" class="inputs-padrao" required>

        <label for="email">E-mail</label>
        <input type="email"  placeholder="seuemail@dominio.com" id="email" class="inputs-padrao" required >
        
        <label for="telefone">Telefone</label>
        <input type="tel"  placeholder="(99) 99999-9999" id="telefone" class="inputs-padrao" required >

        <label for="mensagem">Mensagem</label>
        <textarea  id="mensagem" cols="67" rows="10" placeholder="Mensagem"></textarea>

        <legend>Como prefere o nosso contato?</legend>

        <label for="radio-email"><input type="radio" name="" id="radio-email">e-mail</label>
        

        <label for="radio-telefone"><input type="radio" name="" id="radio-telefone">Telefone</label>
        

        <label for="radio-whatsapp"><input type="radio" name="" id="radio-whatsapp">Whatsapp</label>

        <legend>Qual horário prefere ser atendido?</legend>
        <select name="" id="">
            <option value="">Manhã</option>
            <option value="">Tarde</option>
            <option value="">Noite</option>
        </select>

        <label for="checkbox"><input type="checkbox" name="" id="checkbox" class="checkbox">Gostaria de receber as nossas novidades e promoções por e-mail?</label>


        <input type="submit" value="Enviar" id="enviar" class="enviar">
       
        
      
   </form>

   <table>
    <thead>
         <tr>
               <td>Dia </td>
            <td>Horário</td>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>Segunda-Feira</td>
            <td>08:00 ~ 20:00</td>
         </tr>
    
         <tr>
            <td>Quarta-Feira</td>
             <td>08:00 ~ 20:00</td>
        </tr>
        <tr>
            <td> Sexta-Feira</td>
            <td>08:00 ~ 20:00</td>
        </tr>
        </tbody>
   </table>
   </main>
   
   <footer>
        <img src="./img/logo-branco.png" alt="Logo-banco">
        <p><b>&#169; Copyright Barbearia Space For Men</b></p>
    </footer>
     
</body>
</html>
